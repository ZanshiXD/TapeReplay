<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tape Replay</title>
<script>
// the last theme, before anything paints, so a light one does not open with a flash of the dark one (see next/look.ts)
try {
  const c = JSON.parse(localStorage.getItem('tr-next-look') || 'null');
  const p = c && (c.sys && !matchMedia('(prefers-color-scheme: dark)').matches ? c.light : c.dark);
  if (p) { const r = document.documentElement; r.dataset.theme = p.kind; r.style.colorScheme = p.kind; for (const k in p.v) r.style.setProperty('--' + k, p.v[k]); }
} catch (e) {}
</script>
<div id="root"></div>
<script type="module" src="/src/next/main.tsx"></script>
