# The App Store build: an Xcode project generated by XcodeGen (https://github.com/yonaskolb/XcodeGen) on a Mac,
# in GitHub Actions (.github/workflows/ios-app-store.yml). It builds the same app as `xtool dev`: the TapeReplay
# Swift package (../Package.swift) linked into an app target, plus what the App Store needs and xtool does not
# make on Linux: a compiled icon catalog, version and build numbers, and distribution signing.
#   xcodegen generate   # writes TapeReplay.xcodeproj here (not kept in git)
name: TapeReplay
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TapeReplay:
    path: ..
targets:
  TapeReplayApp:
    type: application
    platform: iOS
    sources:
      - path: AppHost
      - path: Assets.xcassets
    dependencies:
      - package: TapeReplay
        product: TapeReplay
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: TapeReplay
        PRODUCT_MODULE_NAME: TapeReplayApp # the Swift package is the TapeReplay module
        PRODUCT_BUNDLE_IDENTIFIER: com.kuta.tapereplay
        # the shared Info.plist (xtool uses it too), with Xcode's own keys added (versions, executable, ...)
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Icon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
