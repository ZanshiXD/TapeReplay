# Builds TapeReplay.exe on a GitHub Windows machine, signs its update manifest and publishes both to the public,
# binaries-only repository ZanshiXD/TapeReplay-releases. Installed copies find it there at launch and offer the
# update. The source stays in this private repository.
#
# Run it from the Actions tab (Run workflow) with a version higher than the last release.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   UPDATE_SIGNING_KEY  the Ed25519 release key (base64); its public half is in desktop/app.py
#   RELEASES_TOKEN      a fine-grained token with Contents: read and write on TapeReplay-releases only
name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.1.0), higher than the last release
        required: true
      notes:
        description: "What's new, shown in the app (separate lines with ' | ')"
        required: false
        default: Fixes and improvements.

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check the version and secrets
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::The UPDATE_SIGNING_KEY secret is missing."; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::The RELEASES_TOKEN secret is missing."; exit 1; }

      - name: Install the build tools
        run: python -m pip install pyinstaller==6.22.3 pywebview==6.2.1 cryptography==50.0.2

      - name: Build the app
        working-directory: desktop
        env:
          TAPE_VERSION: ${{ inputs.version }}
        run: python build.py dist

      - name: Sign the update
        working-directory: desktop
        env:
          TAPE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s\n' "$NOTES" | sed 's/ | /\n/g' > "$RUNNER_TEMP/notes.txt"
          cp dist/TapeReplay.exe "$RUNNER_TEMP/out/TapeReplay.exe"
          python release.py "$VERSION" "$RUNNER_TEMP/out/TapeReplay.exe" "$RUNNER_TEMP/notes.txt" "$RUNNER_TEMP/out/latest.json"

      - name: Publish to TapeReplay-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/out/TapeReplay.exe" "$RUNNER_TEMP/out/latest.json" \
            --repo ZanshiXD/TapeReplay-releases --title "Tape Replay $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.txt" --latest
          echo "Published $VERSION. Installed copies offer it the next time they start."
