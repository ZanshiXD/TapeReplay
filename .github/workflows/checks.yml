# Checks for pull requests. Nothing here is published or signed.
#   strategies  the Python strategy and indicator runtimes, the page's type check and build (app/, Vite +
#               TypeScript), the core's tests, then the app in Chromium with real Python (strategies, indicators,
#               optimization in workers) and through the Windows app's server (tests/)
#   windows     imports DBN and CSV data through the app's server (tests/test_import.py), long backtests on a
#               long series (tests/test_long_backtest.py), then
#               builds TapeReplay.exe like the release does, kept for a week as a download on the run's page
#   ios         compiles the iOS app (with Python bundled) for the simulator, unsigned
name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the test tools
        run: |
          python -m pip install numpy pandas playwright
          python -m playwright install --with-deps chromium

      - name: Strategy runtime
        run: python tests/test_runtime.py

      - name: Indicator runtime and ta helpers
        run: python tests/test_indicators.py

      - name: Build the page (type check, Vite) and bundle Python
        run: |
          (cd app && npm ci)
          python -c "import sys; sys.path.insert(0, 'desktop'); import build; build.web()"

      - name: The new app's core (replay, orders, journal, drawings) and the new app in the browser
        run: |
          (cd app && npx tsx tests/core.test.ts)
          (cd app && npx tsx tests/prop.test.ts)
          (cd app && npx tsx tests/zones.test.ts)
          (cd app && npx tsx tests/backtest.test.ts)
          (cd app && npx tsx tests/optimizer.test.ts)
          (cd app && npx tsx tests/guide.test.ts)
          (cd app && npx tsx tests/jsindicator.test.ts)
          (cd app && npx tsx tests/data.test.ts)
          python tests/test_next.py "$RUNNER_TEMP/shots"
          python tests/test_drawings.py "$RUNNER_TEMP/shots"
          python tests/test_library.py "$RUNNER_TEMP/shots"
          python tests/test_prop_ui.py "$RUNNER_TEMP/shots"
          python tests/test_chart_trade.py "$RUNNER_TEMP/shots"
          TAPE_SKIP_BUILD=1 python tests/test_studies.py "$RUNNER_TEMP/shots"
          python tests/test_settings.py "$RUNNER_TEMP/shots"
          python tests/test_pyind.py "$RUNNER_TEMP/shots"
          python tests/test_mobile.py "$RUNNER_TEMP/shots"
          python tests/test_guide.py "$RUNNER_TEMP/shots"
          python tests/test_jsind.py "$RUNNER_TEMP/shots"
          python tests/test_drawtools.py "$RUNNER_TEMP/shots"
          python tests/test_dropdowns.py "$RUNNER_TEMP/shots"
          python tests/test_freeze.py "$RUNNER_TEMP/shots"

      - name: Strategies, the optimizer and robustness tests in the browser
        run: TAPE_SKIP_BUILD=1 python tests/test_backtest_ui.py "$RUNNER_TEMP/shots"

      - name: The Windows app's server and update prompt
        run: |
          python tests/test_desktop.py "$RUNNER_TEMP/shots" > "$RUNNER_TEMP/desktop.log" 2>&1 || {
            echo "::error::$(tail -c 3000 "$RUNNER_TEMP/desktop.log" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          tail -1 "$RUNNER_TEMP/desktop.log"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the build tools
        run: python -m pip install pyinstaller==6.22.3 pywebview==6.2.1 cryptography==50.0.2

      - name: Importing price data (DBN and CSV) through the app's server, on Windows
        run: python tests/test_import.py

      - name: Long backtests (years of 1-second data grouped into minutes as they load)
        run: |
          python -m pip install numpy playwright
          python -m playwright install chromium
          (cd app && npm ci)
          python tests/test_long_backtest.py
          python tests/test_stale_range.py

      - name: Build the app
        working-directory: desktop
        run: |
          python build.py dist
          ls -l dist/TapeReplay.exe
          test -f web/pyodide/pyodide.asm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: TapeReplay-exe
          path: desktop/dist/TapeReplay.exe
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the machine
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bundle the page and Python
        working-directory: ios
        run: python3 sync_web.py

      - name: Compile for the simulator (unsigned)
        working-directory: ios/AppStore
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project TapeReplay.xcodeproj -scheme TapeReplayApp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tail -40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Python is inside the app
        run: |
          wasm=$(find "$RUNNER_TEMP/dd/Build/Products" -path '*TapeReplay.app*' -name pyodide.asm.wasm | head -1)
          [ -n "$wasm" ] || { echo "::error::pyodide.asm.wasm is not in the built app"; exit 1; }
          echo "Found $wasm"
          du -sh "$(dirname "$wasm")"
