# Builds the iOS app on a GitHub macOS machine, signs it for the App Store and uploads it to App Store Connect,
# where it shows up in TestFlight after Apple processes it (usually 10 to 30 minutes).
#
# Run it from the Actions tab (Run workflow), or push a tag like ios-v1.0.0.
# Needs four repository secrets (Settings > Secrets and variables > Actions); see ios/APP_STORE.md:
#   ASC_KEY_ID       App Store Connect API key ID (10 characters)
#   ASC_ISSUER_ID    the Issuer ID shown above your keys
#   ASC_KEY_P8       the whole text of the AuthKey_XXXXXXXXXX.p8 file
#   APPLE_TEAM_ID    your paid developer team's ID (Membership details, 10 characters)
name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version people see in the App Store (e.g. 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags: ['ios-v*']

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/AppStore
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # every upload needs a higher build number; the run number always goes up
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the machine (the App Store wants a current iOS SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the secrets are set
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::The $v secret is missing. See ios/APP_STORE.md."; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::The ASC_KEY_P8 secret is missing."; exit 1; }

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          # a tag like ios-v1.2.0 gives the version 1.2.0
          echo "VERSION=${VERSION#ios-v}" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and archive
        run: |
          xcodebuild archive \
            -project TapeReplay.xcodeproj -scheme TapeReplayApp \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TapeReplay.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Sign for the App Store and upload
        run: |
          sed "s/TEAM_ID/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TapeReplay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded version $VERSION (build $BUILD_NUMBER). It appears in App Store Connect > TestFlight once Apple has processed it."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
